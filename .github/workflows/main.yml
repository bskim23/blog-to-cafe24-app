name: Naver Blog to Cafe24 Auto Post

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 코드 체크아웃
        uses: actions/checkout@v3

      - name: 2. 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. 라이브러리 설치 (bs4 포함)
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 4. 파이썬 스크립트 실행
        env:
          CAFE24_MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
          CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
          CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
          CAFE24_REFRESH_TOKEN: ${{ secrets.CAFE24_REFRESH_TOKEN }}
        run: python main.py

      - name: 5. 토큰 갱신 여부 확인
        if: env.NEW_REFRESH_TOKEN != ''
        run: echo "새 리프레시 토큰이 감지되었습니다."
