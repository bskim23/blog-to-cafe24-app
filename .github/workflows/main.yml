name: Blog to Cafe24 Auto Post

on:
  push:
    branches: [ main, master ] # 브랜치 이름 자동 대응
  workflow_dispatch:           # 수동 실행 버튼

jobs:
  update-token-and-post:
    runs-on: ubuntu-latest
    steps:
      # 1. 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 파이썬 설정
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 3. 라이브러리 설치
      - name: Install dependencies
        run: pip install requests

      # 4. 파이썬 스크립트 실행 (글쓰기 + 새 토큰 발급)
      - name: Run script
        id: run_script
        env:
          CAFE24_MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
          CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
          CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
          CAFE24_REFRESH_TOKEN: ${{ secrets.CAFE24_REFRESH_TOKEN }}
        run: python main.py

      # 5. [핵심] 깃허브 Secrets 자동 업데이트 (무한동력)
      - name: Update Refresh Token Secret
        if: env.NEW_REFRESH_TOKEN != '' # 새 토큰이 있을 때만 실행
        env:
          GH_TOKEN: ${{ secrets.PA_TOKEN }} # 로봇에게 주는 열쇠
        run: |
          echo "🔄 깃허브 Secrets 자동 갱신 중..."
          gh secret set CAFE24_REFRESH_TOKEN --body "${{ env.NEW_REFRESH_TOKEN }}"
          echo "✅ 갱신 완료! 다음 실행도 문제 없습니다."
