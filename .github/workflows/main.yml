name: Naver Blog to Cafe24 Sync

on:
  schedule:
    # 12시간마다 실행 (UTC 기준 00:00, 12:00)
    # 한국 시간(KST) 기준: 오전 09:00, 오후 21:00
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    # GitHub 레포지토리 Actions 탭에서 수동으로 실행 가능

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 PyGithub

      - name: Run Python Script
        env:
          CAFE24_MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
          CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
          CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
          CAFE24_REFRESH_TOKEN: ${{ secrets.CAFE24_REFRESH_TOKEN }}
          PA_TOKEN: ${{ secrets.PA_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -u main.py
